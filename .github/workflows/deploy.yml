name: Deploy Serverless Video Platform

on:
  push:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  MEDIACONVERT_ENDPOINT: ${{ secrets.MEDIACONVERT_ENDPOINT || 'https://example.mediaconvert.ap-south-1.amazonaws.com' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:functions
      - run: npm test
      - run: cd infra && npm ci && npm run synth
      - run: cd frontend && npm ci && npm run build

  deploy-infra:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: cd infra && npm ci
      - name: Preflight check
        run: npm run preflight
      - run: cd infra && npx cdk synth
      - run: cd infra && npx cdk deploy --all --require-approval never

  deploy-frontend:
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Write frontend env
        run: bash scripts/post-deploy.sh
      - run: cd frontend && npm ci && npm run build
      - run: aws s3 sync frontend/dist/ s3://${{ secrets.FRONTEND_BUCKET }} --delete
      - run: aws cloudfront create-invalidation --distribution-id ${{ secrets.FRONTEND_DISTRIBUTION_ID }} --paths "/*"
